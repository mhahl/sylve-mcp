[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sylve-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Sylve FreeBSD clusters, Bhyve VMs, Jails, ZFS, Networking, and Backups"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
authors = [
    { name = "Sylve MCP Contributors" },
]
keywords = ["freebsd", "sylve", "bhyve", "jails", "zfs", "cluster", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.25.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pylint>=3.2,<3.3",
    "mypy==1.11.2",
    "tox>=4.15",
    "build>=1.2",
]

[project.scripts]
sylve-mcp = "sylve_mcp.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sylve_mcp = ["swagger.json"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/man/man1/sylve-mcp.1"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit"]
addopts = "-ra"
markers = [
    "live: tests that require a running Sylve system and credentials",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["sylve_mcp"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "duplicate-code",
    "fixme",
    "line-too-long",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-nested-blocks",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "consider-using-f-string",
]

[tool.mypy]
python_version = "3.10"
files = ["src/sylve_mcp"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
warn_return_any = false